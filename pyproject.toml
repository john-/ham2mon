[project]
name = "ham2mon"
version = "0.1.0"
description = "GNU Radio based SDR scanner with a Curses interface"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.25",
]

[project.optional-dependencies]
tensorflow = [
    "tensorflow>=2.10",
]
"ai-edge-litert" = [
    "ai-edge-litert>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "coverage>=6.0",
]

[tool.pytest.ini_options]
pythonpath = ["apps"]
asyncio_mode = "auto"
log_cli = true
log_cli_level = "DEBUG"
log_format = "%(asctime)s %(levelname)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
