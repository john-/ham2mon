# Example frequency configuration file for ham2mon.
#
# Specify this file with the -F/--frequencies command line option to enable:
#   1. Priority frequencies   (priority: <int>, lower number = higher priority)
#   2. Lockout frequencies    (locked: true)
#   3. Frequency labeling     (label: "...")
#   4. CTCSS tone squelch     (tones: [...])
#   5. Bank tags              (banks: [...] on single/range entries or per-tone
#      rules, filtered by --banks / frequency_policies.active_banks)
#
# Each entry is either a single frequency (single: <MHz>) or a frequency
# range (lo: <MHz>, hi: <MHz>), but never both. All frequencies are in MHz.
#
# CTCSS:
#   Tones are configured with the unified "tones:" key as a list of tone
#   values. Each entry is either a bare tone frequency in Hz or a tone rule
#   dict with a tone frequency (ctcss: <Hz>), an optional per-tone label, and
#   optional per-tone banks:
#
#       tones:
#         - ctcss: 67.0        # in Hz
#           label: "Tone A"
#           banks: ["NET_A"]
#         - 71.9               # bare float, in Hz
#
#   A single tone can be written as "tones: [100.0]".
#
#   A channel with tones uses Tone Squelch mode: the demodulator only opens
#   when the carrier includes one of the configured sub-audible tones.
#   Channels without any tone operate in Carrier Squelch (CSQ) mode.
#   See the "CTCSS Squelch and Tone Filtering" section of the README for the
#   full list of valid tone frequencies.

frequencies:

  # Actively monitored channels

  - label: "Local repeater output"
    single: 462.730
    priority: 2
    # No ctcss -- this channel uses Carrier Squelch (CSQ)

  - label: "Some dispatch"
    single: 462.400
    priority: 1
    tones: [100.0]
    # Banks tag this entry for the --banks NET_A filter (see README "Bank Filtering").
    banks: ["NET_A"]

  - label: "General talkaround"
    single: 462.610
    tones: [167.9]

  - label: "Multi-tone repeater"
    single: 462.550
    tones:
      - ctcss: 100.0
        label: "Primary"
        banks: ["NET_A"]
      - 127.3

  # The scanner will detect and record any active channel in these ranges.

  - label: "UHF business band low segment"
    lo: 462.200
    hi: 462.350

  - label: "UHF business band high segment"
    lo: 462.800
    hi: 463.200
    # Range entries take banks the same way; filter with --banks NET_A.
    banks: ["NET_A"]

  # Thw entry below is locked: the scanner will never tune a
  # demodulator to them regardless of activity.

  - label: "Data telemetry burst link"
    single: 462.150
    locked: true
