# ===================================================================
# ham2mon Bare Minimum Starter Configuration File
# ===================================================================

# -------------------------------------------------------------------
# Hardware & SDR Settings (Required to locate and tune your SDR)
# -------------------------------------------------------------------
hardware:
  # The hardware driver argument string (e.g., "airspy,linearity", "rtl=0", "hackrf=0", "uhd")
  args: "uhd"

  # Center frequencies to monitor in MHz (single frequency or hyphenated range)
  center_frequencies:
    - "146"

  # SDR sample rate in Hz (must be at least 1,000,000 / 1 MHz)
  sample_rate: 4.0e+6

  # Frequency correction offset in PPM (uncomment to apply correction)
  # freq_correction: 0

